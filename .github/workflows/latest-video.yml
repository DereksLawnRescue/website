name: Update latest video

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the channel's long-form feed
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, xml.etree.ElementTree as ET
          # UULF = the channel's long videos only (no Shorts)
          url = "https://www.youtube.com/feeds/videos.xml?playlist_id=UULFGHR5gy7_jPfWUTxIOvCUDA"
          xml = None
          for attempt in range(4):
              try:
                  xml = urllib.request.urlopen(url, timeout=30).read()
                  break
              except Exception as e:
                  print(f"Try {attempt + 1}: YouTube feed not available ({e})")
                  time.sleep(20)
          if xml is None:
              # YouTube's feed has hiccups now and then. Keep the current video and try again next hour.
              print("::notice::YouTube feed was down, kept the current latest video")
              raise SystemExit(0)
          ns = {"a": "http://www.w3.org/2005/Atom", "yt": "http://www.youtube.com/xml/schemas/2015"}
          entry = ET.fromstring(xml).find("a:entry", ns)
          if entry is None:
              print("::notice::Feed had no videos, kept the current latest video")
              raise SystemExit(0)
          data = {"id": entry.find("yt:videoId", ns).text, "title": entry.find("a:title", ns).text}
          with open("latest.json", "w") as f:
              json.dump(data, f)
          print(data)
          PY
      - name: Save if it changed
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Update latest video" && (git push || (git pull --rebase && git push)))
